name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java Environment (Required for Flutter/Android toolchains if needed, but good practice)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Resolve dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 4.0 La app usa package:web (compila a WebAssembly): no se aceptan dart:html ni dart:js.
      - name: Sin dart:html ni dart:js
        run: |
          if grep -rnE "^import 'dart:(html|js|js_util)'" lib; then
            echo "Usa package:web y dart:js_interop (ver lib/utils/web_helpers.dart)."
            exit 1
          fi

      # 4.1 Pruebas (bloquean el despliegue si fallan). El código usa dart:html, por lo que
      # las pruebas se ejecutan en la plataforma web (Chrome incluido en ubuntu-latest).
      - name: Run tests
        run: flutter test --platform chrome

      # 5. Extract Firebase Config from GitHub Secret
      - name: Extract Firebase Config
        id: config_extractor
        run: |
          if [ -z "${{ secrets.FIREBASE_CONFIG_JSON }}" ]; then
            echo "ERROR: FIREBASE_CONFIG_JSON secret is empty or missing!"
            exit 1
          fi
          
          # Write the config JSON to a temporary file
          echo '${{ secrets.FIREBASE_CONFIG_JSON }}' > firebase_config.json
          
          # Parse and load into GitHub Environment variables using Node.js
          node -e "
            const fs = require('fs');
            try {
              const config = JSON.parse(fs.readFileSync('firebase_config.json', 'utf8'));
              for (const [key, val] of Object.entries(config)) {
                const envName = key.toUpperCase();
                fs.appendFileSync(process.env.GITHUB_ENV, \`\${envName}=\${val}\n\`);
                console.log(\`Successfully loaded variable: \${envName}\`);
              }
            } catch (e) {
              console.error('Failed to parse FIREBASE_CONFIG_JSON:', e);
              process.exit(1);
            }
          "

      # 6. Build the Web bundle embedding environment keys
      - name: Build Web Application
        run: |
          flutter build web --release \
            --dart-define=apiKey="${{ env.APIKEY }}" \
            --dart-define=mapsApiKey="${{ env.MAPSAPIKEY }}" \
            --dart-define=authDomain="${{ env.AUTHDOMAIN }}" \
            --dart-define=projectId="${{ env.PROJECTID }}" \
            --dart-define=storageBucket="${{ env.STORAGEBUCKET }}" \
            --dart-define=messagingSenderId="${{ env.MESSAGINGSENDERID }}" \
            --dart-define=appId="${{ env.APPID }}" \
            --dart-define=measurementId="${{ env.MEASUREMENTID }}" \
            --dart-define=recaptchaSiteKey="${{ env.RECAPTCHASITEKEY }}"

      # 6.1 Copia estática del catálogo de Lugares: se sirve desde el CDN de Hosting para que
      # Lugares cargue al instante aunque la API esté en arranque en frío. Si falla, la app usa la API.
      - name: Snapshot estático del catálogo de Lugares
        continue-on-error: true
        run: |
          for intento in 1 2 3; do
            if curl -sf --max-time 150 --compressed https://api.ohtli.quest/v1/pois -o /tmp/pois_catalog.json \
              && node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/pois_catalog.json','utf8')); if(!Array.isArray(d.pois)||d.pois.length<100) process.exit(1); console.log('POIs:', d.pois.length)"; then
              cp /tmp/pois_catalog.json build/web/pois_catalog.json
              echo "Catálogo estático listo"
              break
            fi
            echo "Intento $intento fallido; reintentando en 20 s"
            sleep 20
          done

      # 7. Deploy to Firebase Hosting Live Channel
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_OTHLI_497404 }}"
          channelId: live
          projectId: othli-497404

      # 8. Deploy Firebase Rules & Functions
      - name: Deploy Firebase Rules and Functions
        continue-on-error: true
        run: |
          npm install -g firebase-tools
          
          # Write service account JSON to a temporary file
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_OTHLI_497404 }}' > service_account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/service_account.json
          
          # Deploy firestore rules to ensure pois security rules are active
          firebase deploy --only firestore:rules --project=othli-497404 --force || echo "Firestore rules deploy skipped."

          # Deploy firestore indexes (p. ej. viajes públicos por status/visibility para Explorar)
          firebase deploy --only firestore:indexes --project=othli-497404 --non-interactive || echo "Firestore indexes deploy skipped."
          
          # Install dependencies inside functions
          cd functions
          npm ci || npm install
          cd ..
          
          # Deploy functions using Firebase CLI
          firebase deploy --only functions --project=othli-497404 --force || echo "Functions deploy skipped or not configured."
