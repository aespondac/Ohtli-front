<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Ohtli - Tus rutas e itinerarios personalizados en la Ciudad de México. Sitio en construcción.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ohtli">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/assets/icon_isologo.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ohtli | Sitio en Construcción</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #F0EEE9; /* Cloud Dancer */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(44, 102, 110, 0.08); /* Stormy Teal muy translúcido */
      border-radius: 50%;
      border-top-color: #2C666E; /* Stormy Teal principal */
      animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .loading-text {
      color: #0A090C; /* Onyx */
      margin-top: 24px;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: lowercase;
      font-weight: 300;
      opacity: 0.8;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading-indicator">
    <div class="spinner"></div>
    <div class="loading-text">el viaje empieza aquí...</div>
  </div>
  
  <script>
    // Limpieza forzada de Service Workers y Caché local para evitar bloqueos de PWA/caché en dominios personalizados
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
          console.log("Service Worker desregistrado para forzar actualización.");
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
          console.log("Caché PWA eliminada: " + name);
        }
      });
    }

    // Forzar renderizado HTML para solucionar CORS de imágenes de Firebase Storage en navegadores móviles/web (Flutter 3.22+)
    window.flutterConfiguration = {
      renderer: "html"
    };

    // Escuchar el evento oficial del motor de Flutter cuando renderiza el primer frame
    document.addEventListener("flutter-first-frame", function() {
      var loadingEl = document.getElementById('loading-indicator');
      if (loadingEl) {
        loadingEl.style.transition = "opacity 0.4s ease";
        loadingEl.style.opacity = "0";
        setTimeout(function() {
          loadingEl.remove();
        }, 400);
      }
    });
  </script>
  <!-- Lanzador oficial e inalterado de Flutter Web -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
